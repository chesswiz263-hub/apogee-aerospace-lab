name: APOGEE software verification
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tested dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,frames]' 
      - name: Complete regression suite
        run: python -m pytest -q tests
      - name: Produce honest bundled-subset audit (PARTIAL expected)
        run: python -m apogee.v24_validation --allow-partial --output APOGEE-v2.4-ci-audit.json
      - name: Assert no false full-corpus certification
        run: |
          python -c "import json; a=json.load(open('APOGEE-v2.4-ci-audit.json')); assert a['suite_status'] != 'PASS'; assert not a['release_gate']['real_flight_accuracy_validated']"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apogee-verification-audit
          path: APOGEE-v2.4-ci-audit.json
