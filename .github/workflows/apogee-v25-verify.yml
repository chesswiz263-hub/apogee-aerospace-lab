name: APOGEE v2.5 reference validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install APOGEE + external reference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-reference.txt -r requirements-v25.txt
          pip install pytest
      - name: Run fast tests
        run: python -m pytest -q tests
      - name: Run complete Vallado verification and preserve audit
        run: python scripts/v25_render_gate.py
      - name: Publish auditable artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apogee-v25-vallado-audit
          path: |
            reports/v25-render-audit.json
            reference_inputs/SGP4-VER.TLE
            reference_inputs/tcppver.out
          if-no-files-found: warn
